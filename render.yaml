# https://render.com/docs/blueprint-spec
# Account deployment: docs/verification.md V11. Monthly trigger deferred to spec 08.
services:
  - type: web
    name: niryat-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm exec turbo run build --filter=@niryat/web
    startCommand: corepack pnpm --filter @niryat/web start
    healthCheckPath: /
    envVars:
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: BRYNTUM_LICENSE_KEY
        sync: false
  - type: web
    name: niryat-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm exec turbo run build --filter=@niryat/api
    startCommand: corepack pnpm --filter @niryat/api start
    healthCheckPath: /health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_LOGIN_RETURN_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: AI_MONTHLY_BUDGET_USD
        sync: false
      - key: FILE_STORAGE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: niryat-db
          property: connectionString
  - type: workflow
    name: niryat-worker
    runtime: node
    region: oregon
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm exec turbo run build --filter=@niryat/worker
    startCommand: corepack pnpm --filter @niryat/worker start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENVIRONMENT
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_LOGIN_RETURN_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: AI_MONTHLY_BUDGET_USD
        sync: false
      - key: FILE_STORAGE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: niryat-db
          property: connectionString
databases:
  - name: niryat-db
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 5
    databaseName: niryat
    user: niryat
